
[laser_scanning_optics]
relay_magnification = 4
objective_focal_length = "10 mm" # Nikon 20XC 0.7
orientation = "inverted"


[camera_optics]
magnification = 0.758065
orientation = "inverted"


[detectors]

[detectors.0]
type = "generic"
model = "PDA42"

[detectors.1]
type = "generic"
model = "PDA42"


[digitizer]
type = "Alazar"


[stages]
type = "BBD202"

[stages.x_config]
axis = "x"

[stages.y_config]
axis = "y"


[rotation_stage]
type            = "prm1z8"
serial_number   = "83837827"
controller_kind = "tcube"


[beam_attenuator]
type = "half_wave_plate"
min_transmission_position = "45 deg"


[shutter]
type = "shutter_via_ni"
control_channel = "Dev1/port0/line12"


[objective_z_scanner]
type = "zaber_objective_actuator"
axis = "z"
invert_direction = true
position_offset = "1.988 mm"
serial_port = "COM5"
backlash = "10 um"


[encoders] # via NI PCIe-6323
type = "linear_encoders_via_ni"

[encoders.x_config]
signal_a_channel = "/Dev1/PFI4"
signal_b_channel = "/Dev1/PFI13"
sample_clock_channel = "/Dev1/PFI0"
sample_clock_channel_alt = "/Dev1/PFI11"
distance_per_pulse = "200 nm"

[encoders.y_config]
signal_a_channel = "/Dev1/PFI3"
signal_b_channel = "/Dev1/PFI2"
sample_clock_channel = "/Dev1/PFI0"
distance_per_pulse = "200 nm"


[fast_raster_scanner]
type = "resonant_scanner_via_ni"
axis = "x"
angle_limits = {min = "-13.0 deg", max = "13.0 deg"}
frequency = "7910 Hz"
frequency_error = 0.003
analog_control_range = {min = "0 V", max = "5 V"}
amplitude_control_channel = "Dev1/ao2"
response_time = "0.5 s"
#idle_amplitude = "3 deg"


[slow_raster_scanner]
type = "slow_galvo_scanner_via_ni"
axis = "y"
ao_sample_rate = "500 kS/s"
external_line_clock_channel = "/Dev1/PFI0" # fast axis sync signal (in)
frame_clock_channel = "/Dev1/PFI1" # generated frame clock (out)
analog_control_channel = "Dev1/ao3" # axis waveform analog out
angle_limits = {min = "-13.0 deg", max = "13.0 deg"} # Optical angle
analog_control_range = {min = "-10 V", max = "10 V"}
invert = true
flyback_time = "2 ms"


[frame_grabber] # NI PCIe-1429
type = "ni_frame_grabber"
device_name = "img0"


[line_camera]
type = "uniiqa_plus_color"
axis = "y"
pixel_size = "5 μm"
flip_line = false


[illuminator]
type = "led_via_ni"
enable_channel = "Dev1/port0/line8"
